{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Wizard Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'main/assets/img/favicon.png' %}" rel="icon">
  <style>
    body, html {
      height: 100%;
      margin: 0;
      background: url("{% static 'main/images/dashboard-img.jpg' %}") no-repeat center center fixed;
      background-size: cover;
    }
    .card {
      background-color: rgba(255, 255, 255, 0.8); /* Semi-transparent white */
      backdrop-filter: blur(10px);
      border-radius: 15px;
      border: none;
      padding: 20px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
      max-height: 80vh; /* Set the maximum height for the card */
      overflow-y: auto; /* Enable vertical scrolling */
    }
    .btn-custom {
      background-color: #ce1213;
      color: #fff;
    }
    .btn-custom:hover {
      background-color: #a30e0e;
    }
    label {
      color: #ce1213;
    }
  </style>
</head>
<body class="d-flex justify-content-center align-items-center">
  <div class="container text-center">
    <div class="card mx-auto" style="max-width: 600px;">
      <h2 class="text-center mb-3" style="color: #ce1213;">AI Recipe Generator</h2>
      <a href="{% url 'logout' %}" class="w-100 mb-1" style="color: #ce1213;">Log Out ⮕</a>
      <hr style="border: 1px solid #ce1213; margin: 20px 0;">
      <form id="recipe-form" method="POST" action="/dashboard/">
        {% csrf_token %}
        <!-- Ingredients -->
        <div class="mb-3">
          <label for="ingredients" class="form-label">Ingredients (Required)</label>
          <input type="text" id="ingredients" name="ingredients" class="form-control" placeholder="Enter ingredients (comma-separated)" required>
        </div>

        <!-- Meal Type -->
        <div class="mb-3">
          <label for="meal-type" class="form-label">Meal Type (Required)</label>
          <select id="meal-type" name="meal-type" class="form-select" required>
            <option value="" disabled selected>Select Meal Type</option>
            <option value="healthy">Healthy</option>
            <option value="cheat meal">Cheat Meal</option>
            <option value="bulking">Bulking</option>
            <option value="weight-loss">Weight Loss</option>
            <option value="high-protein">High Protein</option>
            <option value="low-fat">Low Fat</option>
            <option value="low-carb">Low Carb</option>
            <option value="meal-prep">Meal Prep</option>
            <option value="snack">Snack</option>
            <option value="quick-meal">Quick Meal</option>
            <option value="family-meal">Family Meal</option>
            <option value="kid-friendly">Kid-Friendly</option>
          </select>
        </div>

        <!-- Dietary Choice -->
        <div class="mb-3">
          <label for="dietary-choice" class="form-label">Dietary Choice (Required)</label>
          <select id="dietary-choice" name="dietary-choice" class="form-select" required>
            <option value="" disabled selected>Select Dietary Choice</option>
            <option value="none">None</option>
            <option value="vegan">Vegan</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="pescatarian">Pescatarian</option>
            <option value="carnivore">Carnivore</option>
            <option value="keto">Ketogenic</option>
            <option value="paleo">Paleo</option>
            <option value="low-carb">Low-Carb</option>
            <option value="gluten-free">Gluten-Free</option>
            <option value="dairy-free">Dairy-Free</option>
            <option value="halal">Halal</option>
            <option value="kosher">Kosher</option>
          </select>
        </div>

        <!-- Amount of Meals -->
        <div class="mb-3">
            <label for="meal-count" class="form-label">Number of Meals (Max 3)</label>
            <input type="number" id="meal-count" name="meal-count" class="form-control" placeholder="Choose Generated Meals" max="3" min="1" required>
        </div>

        <!-- Calories -->
        <div class="mb-3">
          <label for="calories" class="form-label">Calories for all meals</label>
          <input type="number" id="calories" name="calories" class="form-control" placeholder="Optional">
        </div>

        <!-- Protein -->
        <div class="mb-3">
          <label for="protein" class="form-label">Protein (g) for all meals</label>
          <input type="number" id="protein" name="protein" class="form-control" placeholder="Optional">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-custom btn-block w-100 mb-3">Generate Recipe</button>
        <!-- Loading Indicator -->
        <p id="loading-text" style="display: none; color: #ce1213; font-weight: bold; margin-top: 10px;"></p>
      </form>

      <!-- Recipe Output -->
      <div id="recipe-output" style="display: none;">
        <h4 class="text-center" style="color: #ce1213;">Generated Recipe</h4>
        <div id="submitted-data" class="mb-3" style="text-align: left;"></div>
        <div id="recipe-details" style="text-align: left; padding: 10px; background-color: #f9f9f9; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
            <!-- Recipe content will appear here -->
        </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('recipe-form');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Prevent default form submission

            const formData = new FormData(form); // Gather form data
            const outputDiv = document.getElementById('recipe-output');
            const submittedData = document.getElementById('submitted-data');
            const recipeDetails = document.getElementById('recipe-details');
            const loadingText = document.getElementById('loading-text');

            // Clear previous results
            outputDiv.style.display = 'none';
            submittedData.innerHTML = '';
            recipeDetails.innerHTML = '';

            // Ensure "Loading..." is visible and starts animating
            loadingText.style.display = 'block';
            loadingText.innerHTML = 'Loading';
            const loadingAnimation = startLoadingAnimation('loading-text');

            // Scroll to the "Loading..." text immediately
            loadingText.scrollIntoView({ behavior: 'smooth' });

            // Send the data to the server via AJAX
            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': form.querySelector('input[name="csrfmiddlewaretoken"]').value,
                },
            })
                .then((response) => response.json())
                .then((data) => {
                    // Stop the loading animation and hide the "Loading..." text
                    stopLoadingAnimation(loadingAnimation);
                    loadingText.style.display = 'none';

                    if (data.success) {
                        // Show the submitted data and generated recipe
                        outputDiv.style.display = 'block';
                        submittedData.innerHTML = `
                            <h5>Submitted Information:</h5>
                            <ul>
                                <li><strong>Ingredients:</strong> ${data.received_data.ingredients}</li>
                                <li><strong>Meal Type:</strong> ${data.received_data.meal_type}</li>
                                <li><strong>Dietary Choice:</strong> ${data.received_data.dietary_choice}</li>
                                <li><strong>Meal Count:</strong> ${data.received_data.meal_count}</li>
                                <li><strong>Calories:</strong> ${data.received_data.calories}</li>
                                <li><strong>Protein:</strong> ${data.received_data.protein}</li>
                            </ul>
                        `;
                        recipeDetails.innerHTML = `
                            <h5>Generated Recipe:</h5>
                            <div style="white-space: pre-line;">${data.recipe}</div>
                        `;

                        // Scroll to the output section
                        outputDiv.scrollIntoView({ behavior: 'smooth' });
                    } else {
                        submittedData.innerHTML = `<p class="text-danger">${data.error}</p>`;
                    }
                })
                .catch((error) => {
                    console.error('Error:', error);

                    // Stop the loading animation and hide the "Loading..." text
                    stopLoadingAnimation(loadingAnimation);
                    loadingText.style.display = 'none';

                    submittedData.innerHTML = `<p class="text-danger">An error occurred. Please try again.</p>`;
                });
        });
    });

    function startLoadingAnimation(elementId) {
        const element = document.getElementById(elementId);
        let dotCount = 0;

        // Start the interval to update dots
        const interval = setInterval(() => {
            dotCount = (dotCount + 1) % 4; // Cycle between 0, 1, 2, 3
            element.textContent = 'Loading' + '.'.repeat(dotCount); // Update the text
        }, 500);

        return interval;
    }

    function stopLoadingAnimation(intervalId) {
        clearInterval(intervalId); // Stop the interval
    }
</script>

  <script>
    function startLoadingAnimation(elementId) {
    const element = document.getElementById(elementId);
    let dotCount = 0;
    // Start the interval to update dots
    const interval = setInterval(() => {
        dotCount = (dotCount + 1) % 4; // Cycle between 0, 1, 2, 3
        element.textContent = 'Loading' + '.'.repeat(dotCount); // Update the text
    }, 500);
  return interval;
}

function stopLoadingAnimation(intervalId) {
  clearInterval(intervalId); // Stop the interval
}
  </script> 
</body>
</html>
